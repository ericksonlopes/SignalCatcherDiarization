version: '3.8'

services:
  app:
    build: .
    container_name: signalcatcherdiarization_app
    restart: unless-stopped
    user: "root"
    ports:
      - "5001:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-}
      POSTGRES_HOST: ${POSTGRES_HOST-postgresql}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE-signalcatcher}
      LIST_LOG_LEVELS: ${LIST_LOG_LEVELS:-ERROR,WARNING,INFO}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - nas_ssd:/youtube
    networks:
      - shared_postgres_network
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  nas_ssd:
    driver: local
    driver_opts:
      type: cifs
      o: "username=guest,password=,vers=3.0"
      device: "//eriberry/SSD_1"

networks:
  shared_postgres_network:
    external: true
    name: signalcatcher_network
