version: '3.8'

services:
  app:
    build: .
    container_name: signalcatcherdiarization_app
    restart: unless-stopped
    user: "root"
    ports:
      - "8001:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-}
      POSTGRES_HOST: ${POSTGRES_HOST-}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE-signalcatcher}
      LIST_LOG_LEVELS: ${LIST_LOG_LEVELS:-ERROR,WARNING,INFO}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - nas_ssd:/youtube
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  nas_ssd:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USERNAME:-rasp},password=${SMB_PASSWORD:-rasp},vers=3.0"
      device: "//192.168.1.12/SSD_1"


