[project]
name = "signalcatcher_diarization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.18.5",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "requests>=2.34.2",
    "whisperx>=3.8.6",
    "huggingface-hub>=0.36.2",
    "python-multipart>=0.0.32",
    "apscheduler>=3.11.3",
    "torch",
    "torchvision",
    "torchaudio",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "mypy>=2.3.0",
]
